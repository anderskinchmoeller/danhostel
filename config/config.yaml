# Prismotor – konfiguration
#
# Alle tal her kan ændres uden at røre kode. Genstart servicen efter en ændring.
# Start med lageret nedenfor og med bar_base, bed_base, price_floor og bed_floor.
# Resten kan vente til efter første måneds drift.

database_url: "sqlite:///data/rms.db"

adapters:
  pms: csv          # eneste værdi i dag: belægning uploades eller læses fra en mappe
  rateshop: manual  # eneste værdi i dag: konkurrentpriser uploades i hånden

# ---------------------------------------------------------------------------
# Lageret — det vigtigste at få rigtigt
# ---------------------------------------------------------------------------
# Tallene herunder er et bud ud fra husets offentlige beskrivelse: 72 værelser,
# heraf 20 med eget bad, og 330 senge i alt. Eksempelopdelingen nedenfor giver kun 320. Ret dem til jeres faktiske
# opdeling i Picasso, før I bruger priserne til noget.
#
#   private_rooms      værelser der ALTID sælges som private (typisk dem med bad)
#   flex_rooms         værelser der kan sælges som familieværelse ELLER som senge
#   beds_per_flex_room senge i sådan et rum
#   dorm_beds          senge i de faste sovesale
#
# Flex-rummene er hele pointen. Modellen regner hver dag ud, hvilken vej de
# forventes at tjene mest. Forslaget kræver kontrol af konkrete rum og hele ophold.
# Opdateret 21-09-2026 fra Picassos rumtyper (Occupancy pr. rumtype) og
# reservationshistorik 2024-2025. Se projektdokumentet picasso-kalibreringseksport.md.
# Opdateret 28-09-2026 fra rumlisten (filen rooms): D2 = 13 (var 14).
#   Private: D1 1, D2 13, D4 8, F1 17, F3 11. Sengekoderne BD*/BF* findes, men
#            bruges næsten aldrig (<1 % af salget), så rummene regnes som private.
#   Flex:    sovesalene V6 (7 x 6), V8 (6 x 8), V10 (6 x 10), FS (1 x 8) = 20 rum,
#            158 senge. Sælges både samlet og pr. seng. Modellen kan kun have én
#            rumstørrelse, så 8 senge pr. rum er et gennemsnit (160 mod reelt 158).
#   Dorm:    SK4 (rum 527), 4 senge, sælges kun pr. seng.
inventory:
  confirmed: true         # afstemt med Picasso 21-09-2026
  private_beds: 148       # F1 64 + F3 40 + D4 16 fra Picasso; D2 26 + D1 2 (aldrig over 2 gæster i 2024-2025)
  private_room_types: {D1: 1, D2: 13, D4: 8, F1: 17, F3: 11}
  private_rooms: 50
  flex_rooms: 20 # man sœlger altid vœrelser og aldrig en seng.
  flex_room_types: {FS: 1, V8: 6, V6: 7, V10: 6}   # skal summere til flex_rooms
  beds_per_flex_room: 8
  dorm_beds: 4

operations:
  horizon_days: 120        # hvor langt frem der prissættes
  auto_publish: false      # false = manuel kontrol. Sæt først til true når du stoler på modellen
  stale_hours: 36          # ældre data end dette → dødmandsknap, priser fastfryses
  run_cron_hour: 4         # natlig kørsel, lokal tid
  run_cron_minute: 15
  timezone: "Europe/Copenhagen"

pricing:
  # Grundpriser på referencedagen: onsdag i skuldersæson.
  # Sæt dem til jeres medianpris på dage hvor belægningen landede 75-85 %.
  bar_base: 645     # dobbeltværelse uden bad
  bed_base: 270     # én dormseng

  # Ældre målbelægningsparametre. De bliver stadig indlæst for historiske
  # analyser og test, men v4's prisvalg styres af bid price, ikke af et mål.
  #
  # Sænk målet, hvis I hellere vil have høj pris end fuldt hus. Hæv det, hvis
  # tomme senge gør mere ondt end lav pris — fx fordi caféen og morgenmaden
  # tjener på hovederne.
  target_occupancy_rooms: 0.55   # 21-09-2026: historisk ~0.45 (hverdag 0.39, weekend 0.61)
  target_occupancy_beds: 0.12    # 21-09-2026: historisk ~0.08 (hverdag 0.06, weekend 0.12)

  # Hvor hårdt afvigelsen fra målet slår igennem.
  k_forecast: 0.90
  k_forecast_beds: 0.80
  pace_min: 0.85
  pace_max: 1.20

  # Rate shopping vejer mindre for et hostel end for et hotel: produkterne er
  # ikke sammenlignelige på samme måde. En seng i et sekssengsrum med god
  # stemning er ikke samme vare som en seng ti minutter væk. Derfor 0,45 og 0,30
  # her mod 0,60 i en hotelmodel.
  k_market: 0.45
  k_market_bed: 0.30
  market_min: 0.85
  market_max: 1.15

  event_max: 1.45          # loft over eventtillæg, så en tastefejl ikke løber løbsk
  max_daily_change: 0.15   # ændringsbremse

  # Økonomi og guardrails
  variable_cost: 91         # de har i gennemsnit 2.28 senge pr vœrelse de sœlger. pr. solgt privat værelse: rengøring, linned, forbrug
  variable_cost_bed: 39.84        # pr. solgt seng
  commission: 0.16         # vægtet gennemsnit over kanaler; direkte tæller som 0
  price_floor: 375
  price_ceiling: 1400
  bed_floor: 165
  bed_ceiling: 600
  rounding: 10

  # Værelsestyper afledes af grundprisen. Ét tal at forstå i stedet for tyve.
  # Dormsenge står IKKE her — de har deres egen pris og egen prognose.
  room_types:
    # Prislisten følger Picassos rumtyper (filen rooms, 28-09-2026).
    # Faktor = medianpris pr. nat 2024-2025 i forhold til D2 (503 kr.).
    # Historisk niveau, ikke en anbefaling.
    D1: 0.94
    D2: 1.00
    D4: 1.19
    F1: 1.44
    F3: 1.56
    # Sovesale solgt samlet. V8 = 2,5 som den tidligere familie_4 (besluttet
    # 21-09: ~1.610 kr., historisk V8 1.600); de andre skaleret efter deres
    # historiske median i forhold til V8: V6 1.200, V10 1.985, FS 1.691 kr.
    FS: 2.64
    V8: 2.50
    V6: 1.88
    V10: 3.10

  # Sengekoder (Picassos B-typer). Faktor på sengeprisen. Medianpris pr. seng
  # pr. nat 2024-2025 i forhold til 208 kr. (median for alle sovesalssenge).
  # Koder med under 40 salg på to år står på 1,00.
  bed_types:
    BD1: 1.00
    BD2: 1.00
    BD3: 1.00
    BD4: 1.00
    BF1: 1.05   # 219 kr., 42 salg
    BF3: 1.00
    BFS: 1.00
    BSK4: 1.11  # 230 kr.
    BV6: 1.05   # 219 kr.
    BV8: 0.98   # 204 kr.
    BV10: 0.95  # 198 kr.

  # Beregnes af /settings ud fra comp set og egne anmeldelser. Kan overstyres her.
  quality_index: 1.00

  # Ugedagsfaktorer. 0 = mandag ... 6 = søndag. Onsdag er 1,00, fordi
  # grundpriserne er defineret på en onsdag.
  weekday:
    # Kalibreret 21-09-2026 på 2024-2025 (jan-mar 2025 udeladt: renovering)
    0: 0.838
    1: 0.968
    2: 1.0
    3: 0.98
    4: 1.061
    5: 1.086
    6: 0.71

  # Senge er mindre weekendfølsomme: backpackere rejser hele ugen.
  weekday_beds:
    # Kalibreret 21-09-2026 på 2024-2025 (jan-mar 2025 udeladt: renovering)
    0: 0.963
    1: 0.989
    2: 1.0
    3: 1.056
    4: 1.295
    5: 1.413
    6: 0.991

  weekend_days: [4, 5]

  season:
    # Kalibreret 21-09-2026 på 2024-2025 (jan-mar 2025 udeladt: renovering)
    1: 0.75
    2: 0.75
    3: 0.845
    4: 1.0
    5: 1.083
    6: 1.027
    7: 1.136
    8: 1.204
    9: 1.215
    10: 0.999
    11: 0.892
    12: 0.821

  # Hvor stor en andel der plejer at være solgt, X dage før ankomst.
  # Erstattes af egne tal: python -m app.calibration reservationer.csv
  booking_curve:
    # Kalibreret 21-09-2026 på 2024-2025 (jan-mar 2025 udeladt: renovering)
    - {lead_days_from: 0, weekday: 0.386, weekend: 0.614}
    - {lead_days_from: 2, weekday: 0.3, weekend: 0.529}
    - {lead_days_from: 4, weekday: 0.257, weekend: 0.479}
    - {lead_days_from: 8, weekday: 0.186, weekend: 0.386}
    - {lead_days_from: 15, weekday: 0.143, weekend: 0.286}
    - {lead_days_from: 31, weekday: 0.086, weekend: 0.186}
    - {lead_days_from: 61, weekday: 0.071, weekend: 0.114}

  # Senge bookes senere end værelser. Fladere langt ude, stejlere de sidste
  # to uger. Det er derfor de to lagre ikke kan dele prognose.
  booking_curve_beds:
    # Kalibreret 21-09-2026 på 2024-2025 (jan-mar 2025 udeladt: renovering)
    - {lead_days_from: 0, weekday: 0.061, weekend: 0.116}
    - {lead_days_from: 2, weekday: 0.037, weekend: 0.073}
    - {lead_days_from: 4, weekday: 0.03, weekend: 0.049}
    - {lead_days_from: 8, weekday: 0.024, weekend: 0.03}
    - {lead_days_from: 15, weekday: 0.018, weekend: 0.024}
    - {lead_days_from: 31, weekday: 0.012, weekend: 0.012}
    - {lead_days_from: 61, weekday: 0.006, weekend: 0.006}

  # ---------------------------------------------------------------------------
  # Prisstige — v4's faste prisrum
  # ---------------------------------------------------------------------------
  # V4 vælger mellem faste trin fra gulv til top, forankret i dagens grundpris
  # (sæson x ugedag). Bid price vælger det økonomisk bedste trin; stigen giver
  # træghed, afrunding, forklaring, eventtrin og begrænsning på daglige hop.
  # enabled skal være true i drift.
  ladder:
    enabled: true
    # Faktor på dagens grundpris. Ét trin SKAL være 1.00 (referencetrinnet).
    # 9 trin: 3 under reference, 5 over. Afstanden vokser opad.
    rungs_rooms: [0.80, 0.86, 0.93, 1.00, 1.07, 1.15, 1.24, 1.35, 1.48]
    rungs_beds:  [0.80, 0.86, 0.93, 1.00, 1.07, 1.15, 1.24, 1.35, 1.48]

    # Triggervægte, summerer til 1. Rate shopping vejer lavt af samme grund som
    # k_market ovenfor: hostelsenge er dårligt sammenlignelige.
    w_forecast: 0.40
    w_pace: 0.25
    w_market: 0.20
    w_lead: 0.15

    forecast_scale: 0.20   # prognose 20 pp fra målet = fuldt tryk
    pace_z_full: 2.5       # bookingtempo 2,5 standardafvigelser fra det ventede = fuldt tryk.
                           # Poisson-støj: ventet 9 bookinger på en uge, så er 6-12 normalt.
    market_scale: 0.20     # markedet 20 % over/under vores referencepris = fuldt tryk

    score_per_rung: 0.15   # så meget samlet tryk flytter ét trin
    hysteresis: 0.25       # skift først ved 0,75 trin fra nuværende, ikke 0,5
    max_up: 2
    max_down: 1
    max_down_close_in: 2   # de sidste close_in_days må den gå to ned
    close_in_days: 3
    far_out_days: 60       # længere ude: aldrig under referencetrin - 1
    far_out_min_offset: -1
    ratchet: true          # aldrig ned på en dato hvor prognosen >= målet
    smoothing: 0.5         # dagens tryk vejer 50 %, gårsdagens 50 % (ikke de sidste 3 dage)

    # Knaphed: [sandsynlighed for udsolgt, mindste antal trin over reference]
    sellout_protect: [[0.25, 1], [0.50, 2], [0.75, 3]]
    forecast_cv_near: 0.10 # prognoseusikkerhed ved ankomst
    forecast_cv_far: 0.35  # ... 60+ dage ude

    event_rung_step: 0.10  # 10 % eventtillæg = ét trin op, og aldrig under reference

    # Bundet eksploration. Står to nabotrin omtrent lige godt, vælges der
    # tilfældigt mellem dem, og valget logges. Det leverer v4's billige
    # eksperimentdata, men v5-målingen skal være smallere: 40 sammenlignelige
    # datoer, halvdelen 5 % op og halvdelen 5 % ned. Efter en sæson kan
    # k_forecast og k_market erstattes af et tal målt på egne gæster.
    explore: true
    explore_band: 0.35
    explore_max_lead: 60

  # ---------------------------------------------------------------------------
  # Version 4 — bid price i stedet for målbelægning
  # ---------------------------------------------------------------------------
  # Runtime bruger kun v4. For hvert trin på stigen beregnes
  #
  #     forventet omsætning = nettopris x E[min(efterspørgsel, ledig kapacitet)]
  #
  # over hele fordelingen af resterende efterspørgsel (app/demand.py), og det
  # bedste trin vinder. Stigen bruges stadig til træghed, trinbegrænsning og
  # forklaring — men knaphedsbeskyttelsen og ratchet'en slås fra, fordi bid
  # price allerede indeholder knapheden.
  #
  # Grundlaget bygges med:
  #     python -m app.cube        # bygger kali/cube.csv af reservationshistorikken
  #     python -m app.demand      # estimerer config/demand_model.json
  #     python -m app.backtest    # validerer v4 på historikken
  #
  # Mangler modelfilen, stopper indlæsningen med en klar fejl. Projektet falder
  # ikke tilbage til en ældre prismotor.
  v4:
    enabled: true
    model_path: config/demand_model.json
    level_path: data/demand_level.json

    # Egenpriselasticitet. Det ENESTE ukendte tal tilbage i prisbeslutningen,
    # og det er med vilje: ældre motorer havde triggervægte, målbelægninger
    # og en trinafstand, som alle var gæt. Tallene her er litteraturniveau, ikke
    # jeres gæster. De erstattes af eksplorationens målinger efter en sæson.
    # Sættes de til 0, bliver den højeste pris altid den bedste.
    elasticity_rooms: 1.6
    elasticity_beds: 2.0

    # Adaptivt niveau: fanger et strukturelt skift som efteråret 2025
    # (august -21 %, oktober -25 %, november -35 %) uden at nogen skal finde
    # årsagen. Lille eksponent og hårde grænser, så en fejl i inputdata ikke
    # kan trække niveauet i bund.
    level_alpha: 0.07
    level_min: 0.6
    level_max: 1.6

    use_for_flex: true          # marginal flex-allokering i stedet for gennemsnit
    use_for_groups: true        # gruppegulv som sum af bid price pr. enhed

    # Med en konstant elasticitet over 1 og en lav variabel omkostning ligger
    # det ubegrænsede optimum under prisgulvet. Modellen vil derfor stå på
    # nederste trin på enhver dato hvor kapaciteten ikke binder — en
    # ekstrapolation langt væk fra de priser der faktisk er observeret, og en
    # der rammer den svageste delscore, værdi for pengene (7,1 mod 8,9).
    # Indtil eksplorationen har målt elasticiteten, må version 4 ikke rabattere
    # dybere end ét trin under reference.
    elasticity_measured: false
    max_discount_rungs: 1

    # Mindste forskel i kroner før et flex-rum anbefales flyttet til private.
    # Uden den flytter modellen sovesale på datoer hvor begge lagre er tomme,
    # fordi to en halv krone er mere end nul. Anbefalinger man lærer at
    # ignorere er værre end ingen anbefalinger.
    flex_min_gain: 25

    # Gruppegulvet regnes uden elasticitetsdæmpning, indtil elasticiteten er
    # målt. Fortrængningen afhænger af hvor mange værelser der ellers ville
    # være solgt, og dæmper man efterspørgslen med en antagelse ingen har målt,
    # bliver gulvet lavere end det burde være. Et for højt gulv koster en
    # forespørgsel; et for lavt gulv er bindende i et år.
    group_undamped_until_measured: true
